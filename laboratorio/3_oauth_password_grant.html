<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <title>Laboratorio: OAuth 2.0 Password Credentials Grant</title>
    <style>
        body { font-family: sans-serif; margin: 40px; background: #f3f4f6; color: #1f2937; }
        .card { background: white; padding: 25px; border-radius: 8px; max-width: 550px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin: 0 auto; }
        input { display: block; width: 100%; margin-bottom: 12px; padding: 10px; box-sizing: border-box; border: 1px solid #d1d5db; border-radius: 4px; }
        button { color: white; border: none; padding: 12px 24px; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 14px; width: 100%; margin-bottom: 10px; }
        .btn-setup { background: #6b7280; } /* Grigio per setup credenziali */
        .btn-setup:hover { background: #4b5563; }
        .btn-token { background: #4f46e5; } /* Viola IdP per richiesta on-demand */
        .btn-token:hover { background: #4338ca; }
        .btn-api { background: #059669; }  /* Verde API */
        .btn-api:hover { background: #047857; }
        pre { background: #111827; color: #34d399; padding: 15px; border-radius: 6px; overflow-x: auto; font-family: monospace; font-size: 13px; max-height: 200px; }
        .status-box { padding: 10px; border-radius: 4px; font-weight: bold; margin-bottom: 20px; display: inline-block; }
        .disconnected { background: #fee2e2; color: #991b1b; }
        .connected { background: #d1fae5; color: #065f46; }
    </style>
</head>
<body>

<div class="card">
    <h2>OAuth 2.0: Password Credentials Grant</h2>
    <div id="statusLabel" class="status-box disconnected">Stato: Token Mancante</div>
    
    <!-- FASE 1: Inserimento Credenziali -->
    <div id="loginForm">
        <label for="username">Username Utente:</label>
        <input type="text" id="username" placeholder="Es. marco_studente" value="demo">
        
        <label for="password">Password Utente:</label>
        <input type="password" id="password" placeholder="Es. passwordSicura123" value="demo">
        
        <button id="saveCredentialsBtn" class="btn-setup">1. Salva Credenziali in Memoria</button>
        <button id="getTokenOnDemandBtn" class="btn-token" style="display:none;">🔑 Richiedi Token On-Demand (POST)</button>
    </div>

    <!-- FASE 2: Chiamata API Protetta usando il Bearer Token ottenuto -->
    <div id="apiSection" style="display:none;">
        <p style="color: #059669; font-weight: bold;">✓ Token memorizzato con successo!</p>
        <button id="fetchDataBtn" class="btn-api">2. Interroga API Protetta (GET)</button>
        <button id="clearTokenBtn" class="btn-setup" style="background: #dc2626;">Cancella Token (Forza reset)</button>
    </div>

    <h3>Console di Output / Debug:</h3>
    <pre id="output">Inserisci le credenziali per iniziare il test...</pre>
</div>

<script>
    // =======================================================
    // CONFIGURAZIONE: URL 
    // =======================================================
    // NOTA: Se testi con l'IdP esterno Zucchetti mantieni l'URL remoto.
    // Se testi con il server locale Node Express (2_oauth_server.js), puoi usare:
    // const TOKEN_URL = "http://localhost:3000/api/login";
    // const API_URL   = "http://localhost:3000/api/articoli";
    const BASE_OAUTH_URL = "https://idp.zucchettitest.it/identity_provider";
    const TOKEN_URL      = `${BASE_OAUTH_URL}/servlet/oauth/token?scope=logintoken`;     
    const API_URL        = `${BASE_OAUTH_URL}/api/Articoli`;    
    const CLIENT_ID      = "identity_provider_remote";              
    const CLIENT_SECRET  = "zucchetti"; 

    // Variabili volatili per tenere traccia delle credenziali inserite
    let memorizedUser = null;
    let memorizedPass = null;

    // --- AZIONE 1: Salva le credenziali in memoria e mostra il bottone On-Demand ---
    document.getElementById('saveCredentialsBtn').addEventListener('click', () => {
        const user = document.getElementById('username').value;
        const pass = document.getElementById('password').value;
        const output = document.getElementById('output');

        if (!user || !pass) {
            alert("Inserisci sia username che password!");
            return;
        }

        memorizedUser = user;
        memorizedPass = pass;
        
        output.textContent = `Credenziali salvate in memoria per l'utente: ${memorizedUser}\nIl pulsante di richiesta On-Demand è ora attivo.`;
        document.getElementById('getTokenOnDemandBtn').style.display = "block";
    });

    // --- AZIONE 2: Richiesta del Token ON-DEMAND ---
    document.getElementById('getTokenOnDemandBtn').addEventListener('click', async () => {
        const output = document.getElementById('output');

        if (!memorizedUser || !memorizedPass) {
            output.textContent = "Errore: Nessuna credenziale in memoria. Salvale prima col pulsante grigio.";
            return;
        }

        output.textContent = `[ON-DEMAND] Richiesta token in corso per: ${memorizedUser}...\nInvio OPTIONS e POST...`;

        // Costruiamo il body in formato x-www-form-urlencoded
        const bodyParams = new URLSearchParams();
        bodyParams.append('grant_type', 'password'); 
        bodyParams.append('username', memorizedUser);
        bodyParams.append('password', memorizedPass);
        bodyParams.append('client_id', CLIENT_ID);
        bodyParams.append('client_secret', CLIENT_SECRET);

        try {
            // Invio della richiesta POST all'endpoint OAuth per il rilascio del token
            const response = await fetch(TOKEN_URL, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/x-www-form-urlencoded'
                },
                body: bodyParams.toString()
            });

            if (response.ok) {
                const data = await response.json();
                
                if (data.access_token) {
                    sessionStorage.setItem('access_token', data.access_token);
                    output.textContent = `[ON-DEMAND SUCCESS] Token ricevuto alle ore ${new Date().toLocaleTimeString()}!\n\nRisposta IdP:\n` + JSON.stringify(data, null, 2);
                    mostraAreaProtetta();
                } else {
                    output.textContent = "Errore: 'access_token' assente nella risposta.\n\nRisposta:\n" + JSON.stringify(data, null, 2);
                }
            } else {
                const errorData = await response.json().catch(() => ({}));
                output.textContent = `Errore Server (${response.status})\nRichiesta on-demand rifiutata.\n\nDettaglio:\n` + JSON.stringify(errorData, null, 2);
            }
        } catch (err) {
            output.textContent = "Errore critico di rete / Blocco CORS durante la richiesta On-Demand:\n" + err.message;
        }
    });

    // --- AZIONE 3: Chiamata API con Bearer Token ---
    document.getElementById('fetchDataBtn').addEventListener('click', async () => {
        const token = sessionStorage.getItem('access_token');
        const output = document.getElementById('output');
        output.textContent = "Esecuzione chiamata API protetta in corso...";

        try {
            const response = await fetch(API_URL, {
                method: 'GET',
                headers: {
                    'Authorization': `Bearer ${token}`
                }
            });

            const datiApi = await response.json();
            output.textContent = `Risposta dell'API protetta [Status: ${response.status}]:\n\n` + JSON.stringify(datiApi, null, 2);
        } catch (err) {
            output.textContent = "Errore di chiamata API: " + err.message;
        }
    });

    // Reset del Token (Utile per testare la richiesta on-demand più volte)
    document.getElementById('clearTokenBtn').addEventListener('click', () => {
        sessionStorage.removeItem('access_token');
        document.getElementById('statusLabel').textContent = "Stato: Token Mancante";
        document.getElementById('statusLabel').className = "status-box disconnected";
        document.getElementById('loginForm').style.display = "block";
        document.getElementById('apiSection').style.display = "none";
        document.getElementById('output').textContent = "Token rimosso. Puoi richiedere un nuovo token on-demand.";
    });

    function mostraAreaProtetta() {
        const statusLabel = document.getElementById('statusLabel');
        statusLabel.textContent = "Stato: Autenticato con successo";
        statusLabel.className = "status-box connected";
        
        document.getElementById('loginForm').style.display = "none";
        document.getElementById('apiSection').style.display = "block";
    }

    if (sessionStorage.getItem('access_token')) {
        mostraAreaProtetta();
        document.getElementById('output').textContent = "Sessione attiva rilevata in sessionStorage. Pronto per interrogare l'API.";
    }
</script>

</body>
</html>
